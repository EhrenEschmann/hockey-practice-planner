<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey Practice Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E🏒%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tool="select">

<header id="topbar">
  <div class="brand">🏒 Practice Planner</div>
  <select id="practice-select" title="Switch practice"></select>
  <div id="practice-wrap">
    <button id="btn-new-practice" title="Practice details / new practice">+ Practice</button>
    <div id="practice-pop" hidden>
      <h3>Current practice</h3>
      <label class="field"><span>Team</span><input id="practice-team" placeholder="e.g. U13 AA"></label>
      <label class="field"><span>Date</span><input id="practice-date" type="date"></label>
      <label class="field"><span>Start time</span><input id="practice-time" type="time"></label>
      <label class="field"><span>Coaches</span><input id="practice-coaches" placeholder="e.g. Ehren, Mike, Dante"></label>
      <label class="field"><span>Coach emails (can view this practice)</span><input id="practice-emails" placeholder="mike@gmail.com, dante@gmail.com" spellcheck="false"></label>
      <button id="btn-share-link" title="Copy a link coaches can open — they sign in with Google and get a read-only view of this practice">🔗 Copy coach link</button>
      <button id="btn-create-practice" class="primary">＋ Create new practice</button>
    </div>
  </div>
  <button id="btn-dup-practice" title="Duplicate practice">Duplicate</button>
  <button id="btn-del-practice" title="Delete practice" class="danger">Delete</button>
  <div class="spacer"></div>
  <button id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
  <span class="sep"></span>
  <span id="cloud" hidden>
    <span id="cloud-status" class="muted small" title="Practices are auto-saved to your Firebase account"></span>
    <button id="btn-signin" title="Sign in with Google to save practices to the cloud">Sign in</button>
    <button id="btn-signout" title="Sign out" hidden>Sign out</button>
  </span>
  <span class="sep"></span>
  <button id="btn-import" title="Import a practice JSON file">Import</button>
  <button id="btn-export" title="Export this practice as JSON">Export JSON</button>
  <button id="btn-png" title="Export current drill as PNG">Export PNG</button>
  <button id="btn-print" title="Print practice plan">Print</button>
  <button id="btn-present" title="Presentation mode — a read-only scroll-through of this practice (share it with coaches via 🔗 Copy coach link in practice details)">📺 Present</button>
  <input type="file" id="file-import" accept="application/json,.json" hidden>
</header>

<div id="viewbar">
      <span class="label">View:</span>
      <button data-view="full">Full ice</button>
      <button data-view="leftHalf">Left half</button>
      <button data-view="rightHalf">Right half</button>
      <button data-view="leftZone">Left zone</button>
      <button data-view="neutral">Neutral</button>
      <button data-view="rightZone">Right zone</button>
      <span class="sep"></span>
      <button id="btn-zoom-out" title="Zoom out">−</button>
      <button id="btn-zoom-in" title="Zoom in">+</button>
      <span class="sep"></span>
      <label class="check"><input type="checkbox" id="snap-toggle"> Snap to 1 ft</label>

      <span id="hint"></span>
    </div>

<div id="layout">
  <nav id="toolbar">
    <button class="tool" data-tool="select"    title="Select / move (V)&#10;Drag objects; drag waypoint handles to reshape a path (double-click a handle to remove it).&#10;Arrow keys nudge (Shift = 5 ft) · Delete removes."><span class="ico">↖</span><span>Select</span></button>
    <button class="tool" data-tool="pan"       title="Pan (H) — or hold Space / middle mouse&#10;Mouse wheel zooms around the cursor."><span class="ico">✋</span><span>Pan</span></button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="skater"    title="Skater + path (S) — or drag onto the ice&#10;Click to place, keep clicking to add waypoints (or drag to draw freehand). Enter/Esc finishes. Click an existing skater to extend their path.&#10;Delay a start in their panel: &quot;starts when #1 reaches…&quot; a waypoint."><span class="ico">⛸</span><span>Skater</span></button>
    <div class="side-switch" title="New skaters: O = offense (blue), D = defense (red), numbered per side.&#10;Change a skater's side (and colour) later in its Selection panel.">
      <button data-side="O" class="active" title="New skaters are offensive players (blue)"><span class="dot" style="background:#1e56d6"></span>O</button>
      <button data-side="D" title="New skaters are defensive players (red)"><span class="dot" style="background:#d62828"></span>D</button>
    </div>
    <button class="tool" data-tool="coach"     title="Coach (K) — click to place, or drag onto the ice&#10;A diamond marker with a label. Coaches can receive passes and pass or shoot: use the Puck tool on a coach (or drop a puck on them) and set their Facing.&#10;They can move too — use the Skater tool on a coach to give them a path."><span class="ico">📋</span><span>Coach</span></button>
    <button class="tool" data-tool="goalie"    title="Goalie (G) — click or drop near a net to put a goalie in its crease, facing out&#10;Or select a net and press Add goalie."><span class="ico">🧤</span><span>Goalie</span></button>
    <button class="tool" data-tool="contact"   title="Contact point (I) — click where two skaters should collide; their timing syncs so they meet there&#10;Pick who gets the worse of it on the animation bar: they stagger, slow down and lose the puck to the winner."><span class="ico">💥</span><span>Contact</span></button>
    <button class="tool" data-tool="arrow"     title="Arrow annotation (A) — click points, double-click or Enter to finish&#10;Style it (skate / pass / shot / backward) in the Selection panel."><span class="ico">➚</span><span>Arrow</span></button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="cone"      title="Cone (C) — or drag onto the ice"><span class="ico">🔺</span><span>Cone</span></button>
    <button class="tool" data-tool="minicone"  title="Small cone (M) — click for one, drag to lay a row; skaters stickhandle the puck through them"><span class="ico">🔸</span><span>Small cone</span></button>
    <button class="tool" data-tool="tire"      title="Tire (T) — or drag onto the ice"><span class="ico">⭕</span><span>Tire</span></button>
    <button class="tool" data-tool="puck"      title="Puck (P) — click a skater or coach to give them a puck, a pile to take one, or open ice for a loose puck&#10;Select a puck to add passes &amp; shots: Mark on path sets where it happens (drag the P/S marker); a pass can be timed by the receiver, or banked off the boards (drag the B marker)."><span class="ico">⚫</span><span>Puck</span></button>
    <button class="tool" data-tool="pile"      title="Puck pile (L) — a heap of pucks skaters take from; click to place or drag onto the ice&#10;In a skater's panel press Take puck from pile — they pick one up where their path passes the pile (or use Give a puck to… on the pile)."><span class="ico">🪣</span><span>Puck pile</span></button>
    <button class="tool" data-tool="net"       title="Net (N) — or drag onto the ice"><span class="ico">🥅</span><span>Net</span></button>
    <button class="tool" data-tool="obstacle"  title="Obstacle / pad — drag a box (O)"><span class="ico">▬</span><span>Obstacle</span></button>
    <button class="tool" data-tool="raisedpad" title="Raised pad on tires (R) — skaters slide under it; click to place or drag onto the ice"><span class="ico">🛝</span><span>Raised pad</span></button>
    <button class="tool" data-tool="jumppad"   title="Jump pad (J) — a low pad skaters jump over; click to place or drag onto the ice"><span class="ico">🤸</span><span>Jump pad</span></button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="barricade" title="Barricade / divider — click points, Enter to finish (B)"><span class="ico">🚧</span><span>Barricade</span></button>
    <button class="tool" data-tool="zone"      title="Zone / station — drag a box (Z)&#10;Use Focus in its panel to plan a drill in just that section of ice."><span class="ico">▭</span><span>Zone</span></button>
    <button class="tool" data-tool="text"      title="Text label (X)"><span class="ico">T</span><span>Text</span></button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="erase"     title="Erase (E)"><span class="ico">✖</span><span>Erase</span></button>
  </nav>

  <main id="stage">

    <div id="canvas-wrap">
      <svg id="rink" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div id="animbar">
      <button id="btn-play" title="Play / pause (Space)">▶</button>
      <button id="btn-stop" title="Stop &amp; reset">⏹</button>
      <input type="range" id="timeline" min="0" max="10" step="0.01" value="0">
      <span id="time-display">0.0 / 0.0 s</span>
      <label>Speed
        <select id="anim-speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="anim-trails" checked> Show paths</label>
      <label id="impact-loser-wrap" hidden>Impact: worse for
        <select id="impact-loser" title="Which skater gets the worse of each impact during playback"></select>
      </label>
    </div>
  </main>

  <aside id="sidebar">
    <section id="props" class="panel">
      <h2>Selection</h2>
      <div id="props-body"><p class="muted">Nothing selected. Click an object with the Select tool.</p></div>
    </section>

    <section id="plan" class="panel">
      <h2>Drills <span id="plan-total"></span></h2>
      <ol id="drill-list"></ol>
      <div class="row"><button id="btn-add-drill">+ Add drill</button><button id="btn-library" title="Browse every drill from all of your practices and add copies to this one">📚 From library…</button></div>
    </section>

  </aside>
</div>

<div id="library" hidden>
  <div class="lib-panel">
    <div class="lib-head">
      <b>Drill library</b>
      <span class="muted small">every drill from all of your practices</span>
      <input id="lib-search" type="search" placeholder="Search drills…">
      <span class="spacer"></span>
      <span class="muted small">Adding to: <b id="lib-target"></b></span>
      <button id="lib-close" title="Close (Esc)">✕ Done</button>
    </div>
    <div id="lib-grid"></div>
  </div>
</div>
<div id="gate" hidden>
  <div class="gate-card">
    <div class="gate-brand">🏒 Practice Planner</div>
    <p id="gate-msg">Sign in to plan practices.</p>
    <button id="gate-signin" class="primary">Sign in with Google</button>
    <p id="gate-detail" class="muted small"></p>
  </div>
</div>
<div id="present" hidden>
  <div id="present-top">
    <span class="brand">🏒</span>
    <b id="present-title"></b>
    <span class="spacer"></span>
    <span id="present-user" class="muted small"></span>
    <button id="present-close" title="Close">✕</button>
  </div>
  <div id="present-scroll"><div id="present-body"></div></div>
  <div id="present-gate" hidden>
    <div class="gate-card">
      <div class="gate-brand">🏒 Practice Plan</div>
      <p id="present-msg"></p>
      <button id="present-signin" class="primary" hidden>Sign in with Google</button>
    </div>
  </div>
</div>
<div id="print-area"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
